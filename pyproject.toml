[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "peru-pred"
version = "0.1.0"
description = "Soccer prediction model for Peru Primera Division (Dixon-Coles + LightGBM hybrid)."
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "lightgbm>=4.0",
    "scikit-learn>=1.3",
    "click>=8.1",
    "tabulate>=0.9",
    "tqdm>=4.65",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
peru-pred = "peru_pred.cli:main"

[tool.setuptools.packages.find]
include = ["peru_pred*"]
